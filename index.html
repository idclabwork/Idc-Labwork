:root{
  --bg:#f6f5fa;--surface:#fff;--sunken:#efedf6;--line:#dcd8e8;--fg:#1f1b2e;--muted:#6a6480;
  --accent:#5b3e96;--accent-ink:#fff;--teal:#1a9cc0;
  --ok:#1f7a4d;--ok-bg:#e3f4ea;--warn:#9a5b00;--warn-bg:#fdf0d9;--bad:#b3261e;--bad-bg:#fbe4e2;--info-bg:#e6f3f9;
  --g:#17803f;--g-bg:#dcf3e3;--y:#7a5c00;--y-bg:#fff1a8;--r:#fff;--r-bg:#c62828;
  --t1:#2a78d6;--t2:#eb6834;--t3:#1baf7a;--band-g:#e7f6ec;--band-y:#fff8d1;--band-r:#fde6e4;
  --font-ui:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;--font-data:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#15131d;--surface:#1e1b29;--sunken:#262236;--line:#36304a;--fg:#ece9f5;--muted:#a29cb8;--accent:#a98be6;--accent-ink:#15131d;--teal:#5cc6e4;
  --ok:#6fd39c;--ok-bg:#183326;--warn:#f0b65a;--warn-bg:#36290f;--bad:#f2948d;--bad-bg:#3a1a19;--info-bg:#16303b;
  --g:#7fe0a4;--g-bg:#173a25;--y:#f7dc4f;--y-bg:#3d3510;--r:#fff;--r-bg:#c0392b;
  --t1:#3987e5;--t2:#d95926;--t3:#199e70;--band-g:#17271d;--band-y:#2b2712;--band-r:#2f1a1b;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:15px;line-height:1.5}
[hidden]{display:none!important}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;background:none;border:0;color:var(--fg);font:inherit;padding:0;cursor:pointer;text-align:left}
.brand b{font-size:17px} .brand small{display:block;color:var(--muted);font-size:12px}
.lbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
select,input,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
textarea{width:100%;min-height:70px}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.btn{font:inherit;font-weight:600;border-radius:8px;padding:8px 14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;text-decoration:none;display:inline-block}
.btn:hover{background:var(--sunken)} .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)} .btn:disabled{opacity:.5;cursor:not-allowed} .btn.sm{padding:5px 10px;font-size:13px}
.filebtn{position:relative;overflow:hidden} .filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.opener{display:flex;gap:6px;flex-wrap:wrap} .opener input{width:150px;font-family:var(--font-data);text-transform:uppercase}
main{padding-block:18px 60px}
.banner{border-radius:10px;padding:10px 14px;font-size:14px;margin-bottom:14px}
.banner.info{background:var(--info-bg)} .banner.warn{background:var(--warn-bg)} .banner.bad{background:var(--bad-bg)}
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:14px}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:8px 11px;font:inherit;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--accent);border-color:var(--accent)} .tab .n{font-family:var(--font-data);font-size:12px;margin-left:4px}
.queue{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:72px 150px minmax(0,1fr) auto;gap:6px 14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.row:hover{border-color:var(--accent)} .who{min-width:0} .who b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{color:var(--muted);font-size:13px} .right{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.spkno{font-family:var(--font-data);font-weight:700;font-size:13px} .tnum{font-variant-numeric:tabular-nums}
.tooth{font-family:var(--font-data);font-weight:700;color:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;background:var(--sunken);white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.act{background:var(--accent);color:var(--accent-ink)}
.due.late{color:var(--bad);font-weight:600}
.day{display:inline-flex;align-items:center;justify-content:center;min-width:64px;font-family:var(--font-data);font-weight:700;font-size:12px;border-radius:6px;padding:3px 8px;white-space:nowrap;background:var(--sunken);color:var(--muted)}
.day.green{background:var(--g-bg);color:var(--g)} .day.yellow{background:var(--y-bg);color:var(--y)} .day.red{background:var(--r-bg);color:var(--r)}
.day.big{font-size:22px;min-width:120px;padding:14px 12px;border-radius:10px}
.prog{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)} .prog .track{flex:1;min-width:60px;height:6px;border-radius:3px;background:var(--sunken);overflow:hidden} .prog .fill{height:100%;background:var(--accent)}
.sum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.sumbtn{display:flex;flex-direction:column;gap:2px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;padding:10px 12px;font:inherit;cursor:pointer}
.sumbtn b{font-family:var(--font-data);font-size:24px;line-height:1.1} .sumbtn span{font-size:12px;color:var(--muted)} .sumbtn[aria-pressed="true"]{outline:2px solid var(--accent)}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:6px;vertical-align:middle}
.empty{border:1px dashed var(--line);border-radius:12px;padding:26px;text-align:center;color:var(--muted)} .empty b{display:block;color:var(--fg);margin-bottom:4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px} .card.act{border:2px solid var(--accent)}
.card h2{font-size:15px;margin:0 0 10px}
.sheet{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px} .stack{display:flex;flex-direction:column;gap:16px}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:baseline;margin-bottom:12px} .head h1{font-size:21px;margin:0}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px 18px;margin:0} .kv div{min-width:0}
.kv dt{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600} .kv dd{margin:2px 0 0;overflow-wrap:anywhere}
.note{background:var(--sunken);border-radius:8px;padding:10px 12px;white-space:pre-wrap}
.tracker{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.qrbox{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center} #qr{background:#fff;padding:10px;border-radius:8px;line-height:0}
.flow{list-style:none;margin:0;padding:0} .flow li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;padding:3px 0;color:var(--muted);font-size:13px}
.flow .dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--line);margin:4px auto 0} .flow li.done{color:var(--fg)} .flow li.done .dot{background:var(--ok);border-color:var(--ok)}
.flow li.now{color:var(--fg);font-weight:700} .flow li.now .dot{background:var(--accent);border-color:var(--accent)}
.act-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.check{display:flex;flex-direction:column;gap:6px;margin:8px 0 12px} .check label{display:flex;gap:8px;align-items:flex-start}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px} .photos figure{margin:0}
.photos img,.photos .ph{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:var(--sunken);cursor:zoom-in;display:block}
.photos figcaption{font-size:12px;color:var(--muted)}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px} .log li{display:grid;grid-template-columns:120px minmax(0,1fr);gap:10px;font-size:14px}
.log time{font-family:var(--font-data);font-size:12px;color:var(--muted)}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 18px} .form .full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:4px;min-width:0} .field input,.field select,.field textarea{width:100%}
.req::after{content:" *";color:var(--bad)}
.ocr{border:2px dashed var(--accent);border-radius:12px;padding:14px;margin-bottom:16px;background:var(--sunken)}
.ai-filled{outline:2px solid var(--teal)!important} .ai-check{outline:2px solid var(--bad)!important}
table.plain{width:100%;border-collapse:collapse;font-size:13px} table.plain th,table.plain td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
.techsum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:14px} .techsum h3{margin:0 0 6px;font-size:16px}
.techsum dl{display:grid;grid-template-columns:auto auto;gap:2px 10px;margin:0;font-size:13px} .techsum dt{color:var(--muted)} .techsum dd{margin:0;text-align:right;font-family:var(--font-data);font-weight:700}
.chartwrap{position:relative;overflow-x:auto} .chartwrap text{font-family:var(--font-ui);font-size:11px;fill:var(--muted)} .chartwrap .rl{fill:var(--fg);font-size:12px}
.hit{fill:transparent;cursor:pointer} .hit:hover{fill:var(--sunken)}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;box-shadow:0 4px 14px rgba(0,0,0,.15);max-width:240px;z-index:3}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;z-index:20;max-width:90vw}
.lightbox{position:fixed;inset:0;background:rgba(10,8,16,.88);display:grid;place-items:center;z-index:30;padding:20px;cursor:zoom-out} .lightbox img{max-height:90vh;max-width:100%;border-radius:8px}
.login{max-width:380px;margin:8vh auto 0}
.menu{position:relative} .menu-pop{position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.15);padding:6px;min-width:200px;z-index:10;display:flex;flex-direction:column}
.menu-pop button,.menu-pop a{background:none;border:0;text-align:left;padding:9px 12px;border-radius:6px;font:inherit;color:var(--fg);cursor:pointer;text-decoration:none} .menu-pop button:hover,.menu-pop a:hover{background:var(--sunken)}
@media (max-width:760px){.sheet{grid-template-columns:minmax(0,1fr)}.row{grid-template-columns:auto minmax(0,1fr)}.row .who,.row .right{grid-column:1/-1}.row .right{flex-direction:row;flex-wrap:wrap;justify-content:space-between;align-items:center}
  .form{grid-template-columns:minmax(0,1fr)}.sum{grid-template-columns:repeat(2,minmax(0,1fr))}.techsum{grid-template-columns:minmax(0,1fr)}.log li{grid-template-columns:minmax(0,1fr)}.opener input{width:120px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<script>
// ===== GANTI dengan URL Web App Anda (Apps Script → Deploy → Manage deployments → URL berakhiran /exec)
const API = 'https://script.google.com/macros/s/AKfycbyFWx0Y9xgQmcJtrk4JXT3DbRBj1Aqy3y4Tmcbn2tjtJxkTH3ocBDm15WgxoYTy2XG3/exec';
// ==========================================================================
(function () {
  const p = new URLSearchParams(location.search), here = location.origin + location.pathname;
  window.BOOT = { st: p.get('st') || '', spk: p.get('spk') || '', act: p.get('act') || '', k: p.get('k') || '', url: here };
  // Pengganti google.script.run: setiap panggilan dikirim ke doPost di Code.gs
  function runner(ok, fail) {
    return new Proxy({}, { get(_, fn) {
      if (fn === 'withSuccessHandler') return f => runner(f, fail);
      if (fn === 'withFailureHandler') return f => runner(ok, f);
      return (...args) => fetch(API, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ fn, args, from: here })
        }).then(r => r.json())
          .then(j => j.ok ? ok && ok(j.data) : fail && fail(new Error(j.error)))
          .catch(e => fail && fail(new Error('Koneksi ke server gagal: ' + e.message)));
    }});
  }
  window.google = { script: { run: runner() } };
})();
</script>
